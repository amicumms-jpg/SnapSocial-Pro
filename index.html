<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapSocial Pro - Studio Generare Bannere & Social Media</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.85);
            --panel-border: rgba(255, 255, 255, 0.1);
            --accent-primary: #6366f1;
            --accent-hover: #4f46e5;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--panel-border);
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-main);
        }

        .logo-badge {
            background: linear-gradient(135deg, var(--accent-primary), #a855f7);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.65rem;
            text-transform: uppercase;
        }

        .user-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .license-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .badge-free {
            background: rgba(148, 163, 184, 0.2);
            color: var(--text-muted);
            border: 1px solid rgba(148, 163, 184, 0.3);
        }

        .badge-pro {
            background: rgba(245, 158, 11, 0.2);
            color: var(--accent-gold);
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .btn-upgrade {
            background: linear-gradient(135deg, var(--accent-gold), #d97706);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .app-container {
            display: grid;
            grid-template-columns: 340px 1fr;
            flex: 1;
        }

        .sidebar {
            background: var(--panel-bg);
            border-right: 1px solid var(--panel-border);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pro-tag {
            background: var(--accent-gold);
            color: #000;
            font-size: 0.6rem;
            padding: 0.1rem 0.3rem;
            border-radius: 4px;
            font-weight: 700;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            margin-bottom: 0.6rem;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-main);
        }

        input[type="text"], input[type="file"], textarea, select {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 0.5rem;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
            width: 100%;
        }

        input[type="file"] {
            cursor: pointer;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            border-color: var(--accent-primary);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            padding: 0.2rem;
            border-radius: 6px;
            border: 1px solid var(--panel-border);
        }

        input[type="color"] {
            border: none;
            width: 100%;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }

        .presets-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.4rem;
        }

        .preset-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 0.4rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            text-align: center;
        }

        .preset-btn:hover {
            border-color: var(--accent-primary);
            background: rgba(99, 102, 241, 0.2);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 0.3rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            margin-top: 0.2rem;
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.4);
        }

        .main-stage {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, rgba(30, 41, 59, 0.5) 0%, rgba(15, 23, 42, 1) 100%);
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            overflow: hidden;
            max-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #previewCanvas {
            display: block;
            max-width: 100%;
            max-height: 60vh;
            object-fit: contain;
        }

        .action-bar {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-main {
            background: var(--accent-primary);
            color: white;
            font-weight: 600;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
        }

        .btn-main:hover {
            background: var(--accent-hover);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: #1e293b;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 1.5rem;
            max-width: 380px;
            width: 90%;
            text-align: center;
        }

        .modal h2 {
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .modal p {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }

        .license-input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .whop-btn {
            background: #ff5c00;
            color: white;
            text-decoration: none;
            display: block;
            padding: 0.6rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            margin-top: 0.75rem;
        }

        .locked-feature {
            opacity: 0.4;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .app-container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                border-right: none;
                border-bottom: 1px solid var(--panel-border);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span>⚡ SnapSocial</span>
            <span class="logo-badge">PRO</span>
        </div>
        <div class="user-status">
            <div id="licenseBadge" class="license-badge badge-free">
                <span>Gratuit</span>
            </div>
            <button id="upgradeBtn" class="btn-upgrade" onclick="openModal()">PRO</button>
        </div>
    </header>

    <div class="app-container">
        <!-- Sidebar Controale -->
        <div class="sidebar">
            <div>
                <div class="section-title">Format & Dimensiune</div>
                <div class="form-group">
                    <select id="presetSize" onchange="updateCanvas()">
                        <option value="1080x1080">Instagram Post (1:1)</option>
                        <option value="1080x1920">Instagram Story / Reel (9:16)</option>
                        <option value="1200x630">Facebook / LinkedIn Banner</option>
                        <option value="1500x500">Twitter Header</option>
                    </select>
                </div>
            </div>

            <div>
                <div class="section-title">Conținut Text</div>
                <div class="form-group">
                    <label>Insignă / Tag</label>
                    <input type="text" id="badgeText" value="NOUTATE" oninput="updateCanvas()">
                </div>
                <div class="form-group">
                    <label>Titlu Principal</label>
                    <textarea id="mainTitle" rows="2" oninput="updateCanvas()">Lansează-ți Produsul Digital</textarea>
                </div>
                <div class="form-group">
                    <label>Subtitlu</label>
                    <input type="text" id="subTitle" value="Creează, Monetizează și Crește cu Whop" oninput="updateCanvas()">
                </div>
            </div>

            <div>
                <div class="section-title">Stil & Culori</div>
                <div class="form-group">
                    <div class="presets-grid">
                        <button class="preset-btn" onclick="setPreset('neon')">Neon</button>
                        <button class="preset-btn" onclick="setPreset('dark')">Dark</button>
                        <button class="preset-btn" onclick="setPreset('gold')">Gold</button>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Culoare 1</label>
                        <div class="color-picker-wrapper">
                            <input type="color" id="bg1" value="#6366f1" onchange="updateCanvas()">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Culoare 2</label>
                        <div class="color-picker-wrapper">
                            <input type="color" id="bg2" value="#0f172a" onchange="updateCanvas()">
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <div class="section-title">Imagine Personalizată</div>
                <div class="form-group">
                    <label>Încarcă fundal / imagine</label>
                    <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">
                    <button id="removeImgBtn" class="btn-danger" style="display:none;" onclick="removeImage()">Șterge imaginea</button>
                </div>
            </div>

            <!-- Opțiuni PRO locked -->
            <div id="proFeaturesGroup" class="locked-feature">
                <div class="section-title">Opțiuni PRO <span class="pro-tag">PRO</span></div>
                <div class="form-group">
                    <label>Pattern Fundal</label>
                    <select id="bgPattern" onchange="updateCanvas()">
                        <option value="none">Fără Pattern</option>
                        <option value="grid">Grid Linii</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Watermark</label>
                    <input type="text" id="watermarkText" value="@brandul_tau" oninput="updateCanvas()">
                </div>
            </div>
        </div>

        <!-- Zona Principală Preview -->
        <div class="main-stage">
            <div class="canvas-container">
                <canvas id="previewCanvas" width="1080" height="1080"></canvas>
            </div>

            <div class="action-bar">
                <select id="exportFormat" style="width: auto;">
                    <option value="png">PNG</option>
                    <option value="jpeg">JPEG</option>
                </select>
                <button class="btn-main" onclick="downloadImage()">
                    📥 Descarcă Banner
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Licențiere Whop -->
    <div id="licenseModal" class="modal-overlay">
        <div class="modal">
            <h2>Activează Licența PRO</h2>
            <p>Introdu cheia ta primită pe Whop pentru a debloca toate funcțiile avansate.</p>
            
            <div class="license-input-group">
                <input type="text" id="licenseKeyInput" placeholder="ex: DEMO-PRO-2026">
                <button class="btn-main" onclick="validateKey()">Activează</button>
            </div>
            
            <a href="https://whop.com/snapsocialpro/snapsocial-pro-studio-bannere/" target="_blank" class="whop-btn">Cumpără pe Whop ($9.99/lună)</a>
            <button style="background:none; border:none; color:var(--text-muted); margin-top:0.75rem; cursor:pointer; font-size: 0.85rem;" onclick="closeModal()">Închide</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        let isPro = false;
        let uploadedImage = null;

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    uploadedImage = img;
                    document.getElementById('removeImgBtn').style.display = 'block';
                    updateCanvas();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function removeImage() {
            uploadedImage = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('removeImgBtn').style.display = 'none';
            updateCanvas();
        }

        function updateCanvas() {
            const size = document.getElementById('presetSize').value.split('x');
            const w = parseInt(size[0]);
            const h = parseInt(size[1]);

            canvas.width = w;
            canvas.height = h;

            const bg1 = document.getElementById('bg1').value;
            const bg2 = document.getElementById('bg2').value;

            // Gradient de fundal
            const gradient = ctx.createLinearGradient(0, 0, w, h);
            gradient.addColorStop(0, bg1);
            gradient.addColorStop(1, bg2);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, w, h);

            // Randare imagine încărcată de utilizator
            if (uploadedImage) {
                ctx.save();
                ctx.globalAlpha = 0.5; // Opacitate moderată pentru a nu acoperi textul
                
                const scale = Math.max(w / uploadedImage.width, h / uploadedImage.height);
                const x = (w / 2) - (uploadedImage.width / 2) * scale;
                const y = (h / 2) - (uploadedImage.height / 2) * scale;
                
                ctx.drawImage(uploadedImage, x, y, uploadedImage.width * scale, uploadedImage.height * scale);
                ctx.restore();
            }

            // Pattern PRO (Grid)
            if (isPro) {
                const pattern = document.getElementById('bgPattern').value;
                if (pattern === 'grid') {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                    ctx.lineWidth = 2;
                    for (let x = 0; x < w; x += 40) {
                        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
                    }
                    for (let y = 0; y < h; y += 40) {
                        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
                    }
                }
            }

            // Insignă / Tag
            const badgeText = document.getElementById('badgeText').value;
            if (badgeText) {
                ctx.font = 'bold 24px sans-serif';
                const badgeWidth = ctx.measureText(badgeText).width + 30;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.beginPath();
                ctx.roundRect(80, 80, badgeWidth, 45, 8);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.fillText(badgeText, 95, 110);
            }

            // Titlu Principal (suport multi-line)
            const title = document.getElementById('mainTitle').value;
            ctx.font = 'bold 64px sans-serif';
            ctx.fillStyle = '#ffffff';
            
            const titleLines = title.split('\n');
            let startY = 240;
            titleLines.forEach((line, index) => {
                ctx.fillText(line, 80, startY + (index * 75));
            });

            // Subtitlu (poziționat dinamic după titlu)
            const subTitle = document.getElementById('subTitle').value;
            if (subTitle) {
                ctx.font = '32px sans-serif';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                const subY = startY + (titleLines.length * 75) - 15;
                ctx.fillText(subTitle, 80, subY);
            }

            // Watermark PRO
            if (isPro) {
                const wm = document.getElementById('watermarkText').value;
                if (wm) {
                    ctx.font = '20px sans-serif';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.fillText(wm, 80, h - 60);
                }
            }
        }

        function setPreset(theme) {
            if (theme === 'neon') {
                document.getElementById('bg1').value = '#6366f1';
                document.getElementById('bg2').value = '#a855f7';
            } else if (theme === 'dark') {
                document.getElementById('bg1').value = '#1e293b';
                document.getElementById('bg2').value = '#0f172a';
            } else if (theme === 'gold') {
                document.getElementById('bg1').value = '#f59e0b';
                document.getElementById('bg2').value = '#78350f';
            }
            updateCanvas();
        }

        function downloadImage() {
            const format = document.getElementById('exportFormat').value;
            const link = document.createElement('a');
            link.download = `banner-${Date.now()}.${format}`;
            link.href = canvas.toDataURL(`image/${format}`);
            link.click();
        }

        function openModal() {
            document.getElementById('licenseModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('licenseModal').style.display = 'none';
        }

        function validateKey() {
            const key = document.getElementById('licenseKeyInput').value.trim();
            if (key === 'DEMO-PRO-2026' || key.startsWith('WHOP-')) {
                isPro = true;
                document.getElementById('licenseBadge').className = 'license-badge badge-pro';
                document.getElementById('licenseBadge').innerHTML = '★ PRO';
                document.getElementById('upgradeBtn').style.display = 'none';
                document.getElementById('proFeaturesGroup').classList.remove('locked-feature');
                closeModal();
                updateCanvas();
                alert('Licență activată cu succes!');
            } else {
                alert('Cheie nevalidă. Folosește DEMO-PRO-2026 pentru test.');
            }
        }

        updateCanvas();
    </script>
</body>
</html>
